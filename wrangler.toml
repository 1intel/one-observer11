# ONE observer · Cloudflare Worker
# Deploy from this folder:  npx wrangler kv namespace create WITNESS   (paste the id below)
#                            npx wrangler secret put PRESENCE_HMAC       (any long random string)
#                            npx wrangler secret put TURNSTILE_SECRET    (from the Turnstile widget)
#                            npx wrangler secret put WITNESS_PRIVATE_JWK (output of: node ../tools/keygen.js)
#                            npx wrangler secret put ADMIN_TOKEN         (for /__mode)
#                            npx wrangler deploy
name = "one-observer"
main = "worker.js"
compatibility_date = "2026-09-01"

# The dashboard is bundled into the worker as a text module.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ORIGIN = "https://oneintelligence.co"            # the site this worker fronts
TURNSTILE_SITEKEY = "1x00000000000000000000AA"    # Cloudflare test key (always passes). Replace with your widget's site key.
STEPUP_PATHS = "/lead,/contact,/eprice"           # step-up mode applies only here
ENFORCE_PATHS = "/lead"                           # enforce mode applies only here
STEPUP_EPSILON = "0.05"
# APP_SHARED_SECRET (secret) enables /__app/token; SPIFFE_JWKS_URL (var) enables JWT-SVID workload identity; ART_RHO tunes vigilance                           # fraction of unattributed sessions asked at random in step-up mode (calibration of h)
# DEMO_AGENT_JWKS = '{"keys":[...]}'              # optional: serve a signed-agent directory from this host (see tools/agent.js)

[[kv_namespaces]]
binding = "WITNESS"
id = "REPLACE_WITH_NAMESPACE_ID"

[[routes]]
pattern = "proof.oneintelligence.co/*"
zone_name = "oneintelligence.co"
