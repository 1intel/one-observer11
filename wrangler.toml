# ONE observer · single-file deploy (build 1.6)
# Import this repo as a Worker (not Pages): build command empty, deploy command "npx wrangler deploy", root "/".
# Dashboard variables and secrets survive redeploys (keep_vars). Required in the dashboard: TURNSTILE_SITEKEY (variable),
# TURNSTILE_SECRET and ADMIN_TOKEN (secrets). Optional: STEPUP_EPSILON, DEMO_AGENT_JWKS, APP_SHARED_SECRET, SPIFFE_JWKS_URL,
# REGISTRY_JSON, DECLARATIONS_JSON, ART_RHO.
name = "one-observer"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

# The estate learner and the transparency-log seal run every minute.
[triggers]
crons = ["* * * * *"]

# The transparency log is a Durable Object (SQLite-backed).
[[durable_objects.bindings]]
name = "LOG"
class_name = "TransparencyLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TransparencyLog"]

[vars]
ORIGIN = "https://oneintelligence.co"
STEPUP_PATHS = "/contact"
ENFORCE_PATHS = "/none"
STEPUP_EPSILON = "0.05"

# Witnesses, session state, keys and the learner's state. The binding name must stay WITNESS; the id is your namespace.
[[kv_namespaces]]
binding = "WITNESS"
id = "31c69987a9c94de38911914b1ee9f1aa"
