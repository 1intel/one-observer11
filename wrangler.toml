# ONE observer · git-ready single-file deploy
# Deploy to Cloudflare flow (deploy.workers.cloudflare.com/?url=<this repo>) provisions the KV namespace declared below.
# After the first deploy, add in the dashboard: TURNSTILE_SITEKEY (variable), TURNSTILE_SECRET and ADMIN_TOKEN (secrets).
name = "one-observer11"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

[vars]
ORIGIN = "https://oneintelligence.co"
STEPUP_PATHS = "/contact"
ENFORCE_PATHS = "/none"

[[kv_namespaces]]
binding = "WITNESS"
